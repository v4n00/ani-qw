name: Build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg
      - name: Run tests (with retry for transient module fetch failures)
        run: |
          for attempt in 1 2 3; do
            make test integration && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Test run failed (attempt ${attempt}/3). Retrying..."
              sleep 5
            fi
          done
          echo "Test run failed after 3 attempts."
          exit 1
      - run: bash -n install.sh scripts/package.sh
      - run: python3 tests/installer_test.py
  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/package.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/ani-qw-linux-${{ matrix.arch }}.tar.gz
            dist/ani-qw-extension.zip
            dist/ani-qw-source.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches extension version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -c 'import json,os; assert os.environ["TAG"] == "v"+json.load(open("extension/manifest.json"))["version"]'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip | sed 's|  ./|  |' > SHA256SUMS
          gh release create "$TAG" --verify-tag --generate-notes ./*.tar.gz ./*.zip SHA256SUMS
